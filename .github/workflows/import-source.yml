name: Import verified custom source
'on':
  push:
    branches:
    - main
    paths:
    - .custom-bootstrap/**
    - .github/workflows/import-source.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    name: Import exact upstream and custom source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Import and verify source, excluding keys and showcase media
      run: 'set -euo pipefail

        cat .custom-bootstrap/overlay.part* | base64 --decode > "$RUNNER_TEMP/droiddeck-overlay.tar.gz"

        cp .github/workflows/import-source.yml "$RUNNER_TEMP/import-source.yml"

        REMOTE_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)

        test "$REMOTE_HEAD" = "$GITHUB_SHA"

        git fetch --no-tags --depth=1 https://github.com/Droid-Deck/DroidDeck.git f3650d3d379f32a0d33e7a24249ae76023eab8bc

        git read-tree --reset -u FETCH_HEAD

        rm -f keystore/testkey.p12

        rm -rf docs/releases/media docs/media .github/workflows

        tar -xzf "$RUNNER_TEMP/droiddeck-overlay.tar.gz" --no-same-owner

        git add -A

        ACTUAL_TREE=$(git write-tree)

        test "$ACTUAL_TREE" = "6460ed2861c0ecbfb80184e10e719e825366c10e"

        echo "Verified complete custom source tree: $ACTUAL_TREE" >> "$GITHUB_STEP_SUMMARY"

        # Preserve the already-authorized workflow; activation is a separate connector commit.

        rm -f .github/workflows/custom-build.yml

        cp "$RUNNER_TEMP/import-source.yml" .github/workflows/import-source.yml

        git add -A

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git commit -m ''Import pinned DroidDeck source and verified Chinese input customization''

        git push origin HEAD:main

        printf ''Imported source commit: %s\n'' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

        '
